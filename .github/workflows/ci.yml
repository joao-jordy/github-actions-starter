name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  config:
    uses: ./.github/workflows/config.yml
    permissions:
      contents: read
      pull-requests: read

  checks:
    needs: config
    if: needs.config.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run service CI
        env:
          SERVICE_PATH: ${{ matrix.path }}
          SERVICE_NAME: ${{ matrix.name }}
        run: |
          make -C "$SERVICE_PATH" ci
          printf '## %s\n\nService checks passed.\n' "$SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
