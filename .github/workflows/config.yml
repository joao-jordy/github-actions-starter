name: Resolve CI configuration

on:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.config.outputs.matrix }}
      has_services:
        value: ${{ jobs.config.outputs.has_services }}

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_services: ${{ steps.matrix.outputs.has_services }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate services and construct filters
        id: filters
        run: python3 scripts/ci-config.py filters
        env:
          SERVICES: ${{ vars.SERVICES || '[]' }}
      - name: Find changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: ${{ steps.filters.outputs.filters }}
      - name: Construct matrix
        id: matrix
        run: python3 scripts/ci-config.py matrix
        env:
          SERVICES: ${{ vars.SERVICES || '[]' }}
          CHANGES: ${{ steps.changes.outputs.changes }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
